syntax = "proto3";
package serialization.test.proto;
option java_package = "serialization.test.proto";
option java_outer_classname = "ProductProtos";

message Product {
  string id = 1;
  string name = 2;
  double price = 3;
  string category = 4;
  int32 stockQuantity = 5;
}

message ProductList {
  repeated Product products = 1;
}